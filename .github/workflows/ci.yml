name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines: >=20.19 <22 || >=22.12
          node-version: "22.12"
          cache: npm

      - run: npm ci

      # The build imports the generated Prisma client, so generate before building.
      # No database is created and no migration is applied — generate is offline.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm test

      - run: npm run build
