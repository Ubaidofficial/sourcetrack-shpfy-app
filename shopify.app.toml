# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8da6daa6808e52c78a0cc8f92ef6ba59"
application_url = "https://example.com"
embedded = true
name = "sourcetrack-shpfy-app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# read_orders ONLY. Rationale:
#   - orders/paid requires read_orders (or read_marketplace_orders) to register.
#     A subscription declared without it is silently ignored at deploy.
#   - read_all_orders is NOT requested. It only widens the *Admin API read*
#     window past 60 days; this app never reads orders back — every field it
#     reports arrives in the webhook payload itself, in real time. Adding it
#     would mean asking Shopify for approval on data we do not use.
#   - read_customers is NOT requested. The conversion payload we send is
#     deliberately PII-free (no email/phone/name/address) — matching the
#     existing SourceTrack Shopify rail, which documents that same guarantee.
#     Requesting it would pull this app into Shopify's Level 2 protected
#     customer data review, and would create a PII store subject to all three
#     GDPR paths in the main API. We need none of it to attribute revenue.
#
# NOTE: orders are protected customer data even at read_orders / totals-only,
# so Level 1 protected-customer-data access must still be requested and
# approved in the Partner Dashboard before orders/paid will register.
scopes = "read_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Paid orders -> SourceTrack $conversion. orders/paid only (NOT orders/create):
  # the manual rail accepts orders/create but immediately drops it unless
  # financial_status == 'paid', so subscribing to both would only add
  # deliveries we discard. No `include_fields` — note_attributes carries the
  # st_aid stitching key and filtering it out would silently break attribution.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
